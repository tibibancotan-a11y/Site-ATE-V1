<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Site în construcție</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #f3f3f3;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .emoji {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 16px;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="emoji">🚧</div>
    <h1>Site-ul este în construcție</h1>
    <p>Lucrăm la ceva grozav. Te rugăm să revii în curând!</p>
    <div class="footer">© 2025 AgroTeamExpert</div>
  </div>
</body>
</html>
